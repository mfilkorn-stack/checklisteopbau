name: Deploy to GitHub Pages

on:
  push:
    # Das Repository war beim Anlegen leer, deshalb ist derzeit der
    # claude/-Branch der Default-Branch. Beide Namen stehen hier, damit das
    # Deployment auch nach einem Wechsel auf main weiterläuft.
    branches: [main, claude/add-page-github-pages-w2fflz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deployments verhindern, laufende aber nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages im Repository automatisch aktivieren, falls noch nicht geschehen
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
